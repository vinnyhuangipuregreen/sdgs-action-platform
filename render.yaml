services:
  - type: web
    name: sdgs-climate-action-platform
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
